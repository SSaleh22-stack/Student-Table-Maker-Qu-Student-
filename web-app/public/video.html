<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Qu Student · video</title>
<!--
  YouTube player for the Qu Student extension. Extension pages send no referrer, and YouTube
  refuses embeds without one (error 153), so the extension shows this page instead:
  video.html?v=<YouTube video id>. The mobile app uses qustudent.net the same way.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  p { color: #cbd5e1; font: 15px Tahoma, sans-serif; text-align: center; margin: 0; position: absolute; top: 50%; width: 100%; transform: translateY(-50%); }
</style>
</head>
<body>
<script>
  (function () {
    var id = new URLSearchParams(location.search).get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
      var p = document.createElement('p');
      p.textContent = 'المقطع غير متاح';
      document.body.appendChild(p);
      return;
    }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?playsinline=1&rel=0&modestbranding=1';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'Qu Student video';
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
