<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable Buttons Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F8; --surface: #FFFFFF; --line: #E3E9F0; --ink: #1B2533; --muted: #4A5668; --faint: #8A94A3;
    --teal: #0E7490; --teal-2: #155E75; --tint: #E9F6F9; --ok: #166534; --ok-bg: #E3F5EA;
    --red: #B42318; --red-bg: #FDECEA; --red-line: #F3C2BE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; background: #E2E8EF; color: var(--ink); -webkit-font-smoothing: antialiased; }
  svg { display: block; flex-shrink: 0; }
  .intro { max-width: 1100px; margin: 0 auto; padding: 36px 20px 0; }
  .intro h1 { font-size: 26px; }
  .intro p { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .option { max-width: 1100px; margin: 36px auto 0; padding: 0 20px; }
  .option:last-child { margin-bottom: 64px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .num { width: 34px; height: 34px; border-radius: 11px; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .head h2 { font-size: 21px; }
  .pick { font-size: 12.5px; font-weight: 700; color: #14612F; background: #DCF5E4; padding: 3px 10px; border-radius: 999px; }
  .desc { color: var(--muted); font-size: 14.5px; margin: 0 44px 16px 0; margin-inline-start: 44px; margin-inline-end: 0; }
  .pair { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .frame { padding: 10px; border-radius: 40px; background: #151C24; box-shadow: 0 24px 50px rgba(19,32,46,.25); }
  .frame.tab { border-radius: 30px; }
  .screen { overflow: hidden; border-radius: 32px; }
  .frame.tab .screen { border-radius: 22px; }
  .screen > div { transform-origin: top right; }
  .cap { font-size: 13px; color: var(--muted); font-weight: 600; text-align: center; margin-top: 8px; }

  .dev { background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .sq { display: grid; place-items: center; flex-shrink: 0; }
  .status { height: 46px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 6px; font-size: 14px; font-weight: 600; direction: ltr; }
  .dev.ipad .status { height: 26px; align-items: center; padding: 0 22px; font-size: 12px; }
  .logo { border-radius: 13px; background: var(--teal); }
  .total { gap: 4px; padding: 2px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
  .total b { font-size: 14px; color: var(--teal-2); }
  .total span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .okpill { gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-size: 11.5px; font-weight: 700; }
  .card { background: #fff; border-radius: 22px; }
  .days { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; margin-bottom: 6px; }
  .cells { display: grid; gap: 5px; }
  .cells .h { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
  .c { border-radius: 9px; padding: 5px 7px; font-size: 11px; font-weight: 700; direction: ltr; text-align: right; line-height: 1.35; }
  .c small { display: block; font-weight: 600; opacity: .85; }
  .e { background: #F2F5F9; border-radius: 9px; }
  .tabbar { height: 80px; flex-shrink: 0; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 16px 0; }
  .dev.ipad .tabbar { height: 62px; justify-content: center; gap: 150px; padding-top: 8px; }
  .tabbar div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--faint); font-weight: 500; }
  .tabbar .on { color: var(--teal); font-weight: 700; }
  .ibtn { border-radius: 12px; background: #fff; border: 1px solid var(--line); }
  .dim { position: absolute; inset: 0; background: rgba(27,37,51,.4); }
  .course { gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .code { font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 7px; direction: ltr; }
</style>
</head>
<body>
<div class="intro">
  <h1>أزرار صفحة الجدول</h1>
  <p>كل خيار معروض على الجوال والآيباد، ومعه زر «حذف الجدول» الجديد باللون الأحمر.</p>
</div>
<div id="options"></div>
<script>
const P = {
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>',
  trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  forward: '<path d="m15 6-6 6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  star: '<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
};
const ic = (n, s = 20, c = 'currentColor', w = 1.9) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* Actions: icon, short name, full name, description, danger */
const A = [
  ['download', 'استيراد', 'استيراد من البوابة', 'المقررات المطروحة من MyQU', false],
  ['file', 'ملخص', 'ملخص الجدول', 'المقررات وفترات الاختبارات', false],
  ['share', 'تصدير', 'تصدير الجدول', 'صورة، PDF، Excel، تقويم', false],
  ['trash', 'حذف', 'حذف الجدول', 'إزالة كل الشعب المختارة', true],
];
const tone = (danger) => danger ? 'var(--red)' : 'var(--teal-2)';

const logo = (s) => `<div class="logo sq" style="width:${s}px;height:${s}px">${ic('calendar', s * .55, '#fff')}</div>`;
const title = (big) => `<div class="col" style="gap:3px"><span style="font-size:${big ? 23 : 21}px;font-weight:700;line-height:1.2">جدولي</span>
  <div class="row" style="gap:5px"><div class="row total"><b>5</b><span>مقررات</span></div><div class="row total"><b>15</b><span>ساعة</span></div>
  <div class="row okpill">${ic('check', 12, 'currentColor', 2.6)}${big ? 'لا تعارض' : ''}</div></div></div>`;

const C = (code, t, bg, fg, name) => `<div class="c" style="background:${bg};color:${fg}">${code}<small>${t}</small>${name ? `<small style="direction:rtl">${name}</small>` : ''}</div>`;
const pink = ['#FDE2E4', '#B4235A'], green = ['#E2F0DC', '#3F6212'], grey = ['#E5E9F0', '#334155'], violet = ['#ECE6FB', '#5B21B6'];
const grid = (rowH, names) => {
  const n = (s) => names ? s : '';
  const rows = [
    ['8', C('CS101', '8–9:30', ...pink, n('مقدمة في الحاسب')), '<div class="e"></div>', C('CS101', '8–9:30', ...pink, n('مقدمة في الحاسب')), C('CS101', '8–9:40', ...pink, n('مقدمة في الحاسب')), '<div class="e"></div>'],
    ['9', '', '', '', '', ''],
    ['10', C('MATH201', '10–11:30', ...grey, n('التفاضل والتكامل')), C('ISL101', '10–11', ...green, n('الثقافة الإسلامية')), '<div class="e"></div>', C('MATH201', '10–11:30', ...grey, n('التفاضل والتكامل')), C('ISL101', '10–11', ...green, n('الثقافة الإسلامية'))],
    ['11', '', '', '', '', ''],
    ['12', '<div class="e"></div>', C('PHYS101', '12–1:30', ...green, n('الفيزياء العامة')), '<div class="e"></div>', C('PHYS101', '12–1:30', ...green, n('الفيزياء العامة')), '<div class="e"></div>'],
    ['1', '', '', '', '', ''],
    ['2', C('ENG101', '2–3:30', ...violet, n('مهارات اللغة')), '<div class="e"></div>', C('PHYS101', '2–3:40', ...green, n('الفيزياء العامة')), '<div class="e"></div>', C('ENG101', '2–3:30', ...violet, n('مهارات اللغة'))],
  ];
  const cols = '22px repeat(5, 1fr)';
  return `<div class="days" style="grid-template-columns:${cols}"><span></span><span>الأحد</span><span>الاثنين</span><span>الثلاثاء</span><span>الأربعاء</span><span>الخميس</span></div>
    <div class="cells" style="grid-template-columns:${cols};grid-auto-rows:${rowH}px">${rows.map(r => `<div class="h">${r[0]}</div>${r.slice(1).map(x => x || '<div></div>').join('')}`).join('')}</div>`;
};
const tabbar = `<div class="tabbar"><div>${ic('home', 24)}الرئيسية</div><div class="on">${ic('calendar', 24, 'currentColor', 2.1)}الجدول</div><div>${ic('star', 24)}قيم</div><div>${ic('menu', 24)}المزيد</div></div>`;

/* Side panel of offered courses (iPad landscape) */
const panel = () => `<div class="card col" style="width:330px;padding:16px;gap:10px;flex-shrink:0">
  <div class="row" style="gap:8px"><span style="font-size:17px;font-weight:700">المقررات المطروحة</span><span style="font-size:12px;color:var(--muted)">17 شعبة</span></div>
  <div class="row" style="gap:6px"><span style="padding:5px 12px;border-radius:999px;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700">الكل · 17</span>
    <span style="padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px">المضافة · 5</span>
    <span class="sq" style="margin-inline-start:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line)">${ic('search', 15, 'var(--muted)')}</span></div>
  ${[['CS101', 'مقدمة في الحاسب', ...pink], ['MATH201', 'التفاضل والتكامل 2', ...grey], ['STAT201', 'الاحتمالات والإحصاء', '#DCF3EC', '#0F766E'], ['ISL101', 'الثقافة الإسلامية 1', ...green], ['PHYS101', 'الفيزياء العامة 1', ...green], ['ENG101', 'مهارات اللغة الإنجليزية', ...violet], ['GP499', 'مشروع التخرج', '#FEF3C7', '#92400E']]
    .map(([c, n, bg, fg]) => `<div class="row course"><span class="code" style="background:${bg};color:${fg}">${c}</span><span style="flex:1;font-size:13px;font-weight:600">${n}</span>${ic('down', 15, 'var(--faint)')}</div>`).join('')}
</div>`;

/* Builds one phone (390×844) and one iPad landscape (1194×834) for an option */
const phoneShell = (header, extra = '') => `<div class="dev" style="width:390px;height:844px"><div class="status"><span>9:41</span><span>100%</span></div>
  ${header}<div class="card" style="margin:12px 14px 0;padding:12px 10px 8px;flex:1;overflow:hidden">${grid(52, false)}</div>${tabbar}${extra}</div>`;
const ipadShell = (header, extra = '') => `<div class="dev ipad" style="width:1194px;height:834px"><div class="status"><span>9:41</span><span>100%</span></div>
  <div class="row" style="flex:1;min-height:0;gap:16px;padding:8px 18px 14px;align-items:stretch">
    <div class="col" style="flex:1;gap:12px;min-width:0">${header}<div class="card" style="flex:1;padding:14px 12px;overflow:hidden">${grid(76, true)}</div></div>
    ${panel()}
  </div>${tabbar}${extra}</div>`;

/* ---- 1: icons with their names under them ---- */
const labeledIcon = (big) => ([i, s, , , d]) => `<div class="col" style="align-items:center;gap:3px;width:${big ? 58 : 37}px">
  <div class="ibtn sq" style="width:${big ? 42 : 34}px;height:${big ? 42 : 34}px;${d ? 'border-color:var(--red-line);background:var(--red-bg)' : ''}">${ic(i, big ? 19 : 16, tone(d))}</div>
  <span style="font-size:${big ? 12 : 10.5}px;font-weight:600;color:${d ? 'var(--red)' : 'var(--muted)'}">${s}</span></div>`;
const o1 = {
  phone: () => phoneShell(`<div class="row" style="padding:6px 12px 0;gap:8px">${logo(34)}${title(false)}<div class="row" style="margin-inline-start:auto;gap:1px">${A.map(labeledIcon(false)).join('')}</div></div>`),
  ipad: () => ipadShell(`<div class="row" style="gap:12px">${logo(48)}${title(true)}<div class="row" style="margin-inline-start:auto;gap:6px">${A.map(labeledIcon(true)).join('')}</div></div>`),
};

/* ---- 2: clear buttons with icon and word ---- */
const btn = (h, fs) => ([i, s, , , d], k) => `<div class="row" style="flex:1;justify-content:center;gap:6px;height:${h}px;padding:0 14px;border-radius:14px;font-size:${fs}px;font-weight:700;white-space:nowrap;
  ${k === 0 ? 'background:var(--teal);color:#fff' : d ? 'background:#fff;border:1px solid var(--red-line);color:var(--red)' : 'background:#fff;border:1px solid var(--line);color:var(--teal-2)'}">${ic(i, fs + 3)}${s}</div>`;
const o2 = {
  phone: () => phoneShell(`<div class="row" style="padding:6px 16px 0;gap:12px">${logo(42)}${title(false)}</div>
    <div class="row" style="margin:12px 14px 0;gap:6px">${A.map(btn(42, 13.5)).join('')}</div>`),
  ipad: () => ipadShell(`<div class="row" style="gap:12px">${logo(48)}${title(true)}<div class="row" style="margin-inline-start:auto;gap:8px">${A.map((a, k) => btn(44, 14.5)(a, k).replace('flex:1;', '')).join('')}</div></div>`),
};

/* ---- 3: one "options" button ---- */
const optBtn = (h) => `<div class="row" style="margin-inline-start:auto;gap:6px;height:${h}px;padding:0 14px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--teal-2)">${ic('more', 18)}خيارات</div>`;
const menuRows = (iconSize) => A.map(([i, , full, desc, d], k) => `<div class="row" style="gap:13px;padding:12px 0;${k ? 'border-top:1px solid var(--line)' : ''}">
  <div class="sq" style="width:${iconSize}px;height:${iconSize}px;border-radius:13px;background:${d ? 'var(--red-bg)' : 'var(--tint)'}">${ic(i, 21, tone(d))}</div>
  <div class="col" style="flex:1"><span style="font-size:15.5px;font-weight:700;color:${d ? 'var(--red)' : 'var(--ink)'}">${full}</span><span style="font-size:12.5px;color:var(--muted)">${desc}</span></div>
  ${d ? '' : ic('forward', 16, 'var(--faint)', 2.2)}</div>`).join('');
const o3 = {
  phone: () => phoneShell(`<div class="row" style="padding:6px 16px 0;gap:12px">${logo(42)}${title(false)}${optBtn(40)}</div>`,
    `<div class="dim"></div><div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px 30px">
      <div style="width:40px;height:5px;border-radius:3px;background:#D5DCE4;margin:0 auto 12px"></div>
      <div class="row" style="justify-content:space-between;margin-bottom:4px"><span style="font-size:18px;font-weight:700">خيارات الجدول</span><div class="sq" style="width:32px;height:32px;border-radius:50%;background:#F1F4F8">${ic('x', 16, 'var(--muted)', 2.2)}</div></div>
      ${menuRows(44)}</div>`),
  ipad: () => ipadShell(`<div class="row" style="gap:12px">${logo(48)}${title(true)}${optBtn(44)}</div>`,
    `<div style="position:absolute;top:84px;left:378px;width:320px;background:#fff;border-radius:20px;padding:6px 18px;box-shadow:0 18px 48px rgba(19,32,46,.22);border:1px solid var(--line)">${menuRows(42)}</div>`),
};

const options = [
  ['أيقونة مع اسمها', 'نفس الأيقونات في نفس المكان، وتحت كل أيقونة كلمة تشرحها.', o1, false],
  ['أزرار واضحة', 'أزرار فيها أيقونة وكلمة. في الجوال صف كامل تحت العنوان، وفي الآيباد بجانب العنوان مباشرة.', o2, true],
  ['زر «خيارات» واحد', 'زر واحد يفتح قائمة فيها كل الأوامر مع شرح قصير. في الجوال تظهر من الأسفل، وفي الآيباد تظهر تحت الزر.', o3, false],
];
const PS = .62, IS = .5;
document.getElementById('options').innerHTML = options.map(([name, desc, o, pick], k) => `
  <section class="option">
    <div class="head"><span class="num">${k + 1}</span><h2>${name}</h2>${pick ? '<span class="pick">اقتراحي</span>' : ''}</div>
    <p class="desc">${desc}</p>
    <div class="pair">
      <div><div class="frame"><div class="screen" style="width:${390 * PS}px;height:${844 * PS}px"><div style="transform:scale(${PS})">${o.phone()}</div></div></div><div class="cap">الجوال</div></div>
      <div><div class="frame tab"><div class="screen" style="width:${1194 * IS}px;height:${834 * IS}px"><div style="transform:scale(${IS})">${o.ipad()}</div></div></div><div class="cap">الآيباد</div></div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
