name = "qu-student-feedback"
main = "src/index.js"
compatibility_date = "2026-11-01"

# At most 5 messages per minute from one IP address, so nobody can flood your Telegram.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never put them in this file):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
